name: Kontrola progresivniho formulare manzelu
on:
  push:
    branches: [desktop-progressive-spouses]
permissions:
  contents: read
jobs:
  integrate-and-verify:
    if: github.repository == 'dluhovkaosoblazsko-debug/Kalkula-ka-1.2' && github.ref == 'refs/heads/desktop-progressive-spouses'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: desktop-progressive-spouses
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Guarded integration
        run: node scripts/applyProgressiveSpouses.mjs
      - name: Install dependencies without desktop installers
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Progressive form scenarios and server rendering
        run: node scripts/verifyProgressiveSpouses.mjs --render
      - name: Existing reference calculations
        run: npm run verify
      - name: Production build
        run: npm run build
      - name: Commit verified source on the feature branch only
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kalkulacka/HlavniKalkulackaPage.jsx
          git commit -m 'Zapojit otestovany progresivni formular manzelu'
          git push origin HEAD:desktop-progressive-spouses
