name: Overeni puvodnich vysvetlivek
on:
  push:
    branches: [restore-approved-help]
    paths: [.github/workflows/help-restore-integration.yml]
permissions:
  contents: read
jobs:
  restore:
    if: github.repository == 'dluhovkaosoblazsko-debug/Kalkula-ka-1.2' && github.ref == 'refs/heads/restore-approved-help'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: restore-approved-help
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Restore exact historical wording without editing calculations
        run: python3 scripts/restoreApprovedHelp.py
      - name: Install build dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run verify | tee test-results/reference.log
          node scripts/verifyNumericalModel.mjs | tee test-results/numerical.log
          node scripts/verifyAuditRepairs.mjs --render | tee test-results/audit.log
          node scripts/verifyClearLanguage.mjs --render | tee test-results/clear-language.log
          node scripts/verifyMinimumFunding.mjs | tee test-results/minimum-funding.log
          node scripts/verifyApprovedHelp.mjs --history | tee test-results/approved-help.log
          npm run build
      - name: Commit verified restoration only to the feature branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kalkulacka/approvedHelp.json src/kalkulacka/CaseFields.jsx src/kalkulacka/CaseResults.jsx src/kalkulacka/HlavniKalkulackaPage.jsx scripts/verifyClearLanguage.mjs scripts/verifyMinimumFunding.mjs .github/workflows/progressive-spouses.yml
          git commit -m 'Obnovit původní odsouhlasené vysvětlivky bez přepisování'
          git push origin HEAD:restore-approved-help
          git rev-parse HEAD > dist/build-commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: restored-help-review
          retention-days: 7
          path: |
            src/
            scripts/
            test-results/
            dist/
            package.json
            package-lock.json
            index.html
            vite.config.js
