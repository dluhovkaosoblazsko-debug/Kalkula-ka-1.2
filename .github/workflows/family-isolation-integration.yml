name: Integrace rodinnych variant
on:
  push:
    branches: [family-mode-isolation]
    paths: [.github/workflows/family-isolation-integration.yml]
permissions:
  contents: read
jobs:
  integrate:
    if: github.repository == 'dluhovkaosoblazsko-debug/Kalkula-ka-1.2' && github.ref == 'refs/heads/family-mode-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: family-mode-isolation
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Integrate on reviewed base
        run: python3 scripts/applyFamilyIsolation.py
      - name: Dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify logic, exact text and production build
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run verify | tee test-results/reference.log
          node scripts/verifyNumericalModel.mjs | tee test-results/numerical.log
          node scripts/verifyAuditRepairs.mjs --render | tee test-results/audit.log
          node scripts/verifyClearLanguage.mjs --render | tee test-results/clear-language.log
          node scripts/verifyMinimumFunding.mjs | tee test-results/minimum-funding.log
          node scripts/verifyApprovedHelp.mjs --history | tee test-results/approved-help.log
          node scripts/verifyFamilyIsolation.mjs --render | tee test-results/family-isolation.log
          npm run build
      - name: Commit verified integration only to this branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/kalkulacka/HlavniKalkulackaPage.jsx src/kalkulacka/WorkflowForms.jsx src/kalkulacka/CaseFields.jsx scripts/verifyMinimumFunding.py
          git commit -m 'Připojit samostatné rodinné varianty a schválené návazné věty'
          git push origin HEAD:family-mode-isolation
          git rev-parse HEAD > dist/build-commit.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: family-isolation-review
          retention-days: 7
          path: |
            src/
            scripts/
            dist/
            test-results/
            package.json
            package-lock.json
            vite.config.js
            index.html
