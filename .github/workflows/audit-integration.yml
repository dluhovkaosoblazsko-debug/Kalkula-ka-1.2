name: Audit repair integration
on:
  push:
    branches: [audit-repairs-2026-10-01]
permissions:
  contents: read
concurrency:
  group: audit-repair-integration
  cancel-in-progress: false
jobs:
  integrate:
    if: github.repository == 'dluhovkaosoblazsko-debug/Kalkula-ka-1.2' && github.ref == 'refs/heads/audit-repairs-2026-10-01'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: audit-repairs-2026-10-01
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Guarded source integration
        run: node scripts/integrateAuditRepairs.mjs
      - name: Install build dependencies without desktop installers
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reference and regression checks
        run: |
          mkdir -p test-results
          set -o pipefail
          npm run verify | tee test-results/reference.log
          node scripts/verifyNumericalModel.mjs | tee test-results/numerical.log
          node scripts/verifyAuditRepairs.mjs --render | tee test-results/audit.log
      - name: Production build
        run: npm run build
      - name: Commit only verified sources to feature branch
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/ scripts/
          git commit -m 'Integrate verified audit repairs F01-F12'
          git push origin HEAD:audit-repairs-2026-10-01
          git rev-parse HEAD > dist/build-commit.txt
      - name: Save tested build and sources
        uses: actions/upload-artifact@v7
        with:
          name: audit-repairs-verified
          retention-days: 7
          if-no-files-found: error
          path: |
            dist/
            src/
            scripts/
            test-results/
            package.json
            package-lock.json
            vite.config.js
            index.html
